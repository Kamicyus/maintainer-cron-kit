name: Release notes draft

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "30"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install maintainer-cron-kit
      - run: mck release-notes "$GITHUB_REPOSITORY" --days "${{ inputs.days }}" --output RELEASE_DRAFT.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes-draft
          path: RELEASE_DRAFT.md

